name: Android CI

on:
  pull_request:
    paths:
      - 'Android Bienestar/**'
      - '.github/workflows/android.yml'
  push:
    branches:
      - Android
    paths:
      - 'Android Bienestar/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android Bienestar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run Android lint
        run: ./gradlew lint
